<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{.Title}}</title><link rel="stylesheet" href="/static/css/study.css"><link rel="stylesheet" href="/static/css/site_builder_request.css"></head><body class="study-body"><main class="study-main"><a href="/study/notifications">← Уведомления</a><h1>Заявка на образовательный сайт</h1><p>Статус: {{if eq .Status "new"}}Новая{{else if eq .Status "viewed"}}Просмотрена{{else if eq .Status "in_progress"}}В работе{{else}}Завершена{{end}}</p><pre>{{.Body}}</pre><form method="post" action="/study/site-request/status"><input type="hidden" name="csrf_token" value="{{.CSRF}}"><input type="hidden" name="notification" value="{{.Notification}}"><label>Статус заявки <select name="status"><option value="new" {{if eq .Status "new"}}selected{{end}}>Новая</option><option value="viewed" {{if eq .Status "viewed"}}selected{{end}}>Просмотрена</option><option value="in_progress" {{if eq .Status "in_progress"}}selected{{end}}>В работе</option><option value="completed" {{if eq .Status "completed"}}selected{{end}}>Завершена</option></select></label><button class="study-button" type="submit">Сохранить и отметить прочитанной</button></form></main></body></html>
